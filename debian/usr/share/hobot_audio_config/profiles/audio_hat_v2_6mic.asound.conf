# Audio Driver HAT V2 6-Mic ring (X5): named-PCM contract, installed to
# /etc/asound.conf.
#
# Card topology hw-verified on X5 MD + 6mic ring (2026-11-19): card name
# "duplexaudioi2s1"; dev0 = ES8156 stereo playback, dev1 = ES7210 8ch
# capture ('aplay -l' / 'arecord -l' on target; reverses the earlier
# kernel-code-derived assumption).
#
# Channel map: ch1-6 live ring mics, ch7/8 AEC ref slots (digital silence
# in raw capture); verified LIVE with per-channel RMS after PGA1-6=14.
# Ref-line liveness verified with playback running (ch7/8 RMS rise to
# ~300-420 while x5_play2 plays).
#
# Duplex constraint (full matrix measured 2026-11-20, incl. 8k/48k and
# mono/8ch playback dimensions): concurrent capture + playback on this
# card is ONLY reliable as: capture opened FIRST (preferred - playback
# then may be 2ch..8ch), or playback opened FIRST but then ONLY at 8ch
# (must match the capture TDM slots; 2ch playback first locks the link
# into stereo slots and the capture stream corrupts on first read),
# SAME sample rate on both sides (8k/16k/48k all verified), both S16_LE. Any 24-bit/
# 32-bit concurrent combination fails at hwparams ("Invalid argument") or
# is unstable; playback mono fails; opening playback first corrupts the
# capture stream (first read I/O error); cross-rate fails regardless of
# order. The es7210 capture driver accepts S16_LE/S24_LE/S32_LE only
# (FLOAT/S24_3LE open-fail on capture; do not mistake standalone-playback
# rc=0 for a duplex pass). Standalone streams are NOT limited: capture
# 8k/16k/48k x S16/S24/S32; playback any rate x S16/S24/S32 x 1-8ch.
# The link parameters are locked by the first opened stream on the
# shared duplex I2S link. AEC consumers MUST open capture first, then
# drive playback at the same rate, S16_LE.
# Same constraint class as the S100 ES8156 dai clock limitation that led
# the S100 es7210 profiles to drop the play PCM entirely - on X5
# standalone playback works, so x5_play2 is kept.
#
# Contract rules: named PCMs only; overriding the default PCM or global
# defaults is forbidden (engine validate enforces).

pcm.x5_mic8 {
    # raw TDM capture: 6 mics + 2 ref slots, exclusive access
    type hw
    card "duplexaudioi2s1"
    device 1
}

pcm.x5_mic6 {
    # 6mic algorithm contract: 6 mics + 2 ref (pure matrix, no resample)
    type route
    slave {
        pcm "hw:CARD=duplexaudioi2s1,DEV=1"
        format S16_LE
        channels 8
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.2.2 1
    ttable.3.3 1
    ttable.4.4 1
    ttable.5.5 1
    ttable.6.6 1
    ttable.7.7 1
}

pcm.x5_mic4 {
    # 4mic algorithm contract on this board: first 4 mics + 2 ref
    # (pure matrix, no resample)
    type route
    slave {
        pcm "hw:CARD=duplexaudioi2s1,DEV=1"
        format S16_LE
        channels 8
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.2.2 1
    ttable.3.3 1
    ttable.4.6 1
    ttable.5.7 1
}

pcm.x5_play2 {
    # stereo playback to the ES8156 codec
    type hw
    card "duplexaudioi2s1"
    device 0
}
