# Hiwonder Audio Driver HAT (X5): named-PCM contract, installed to
# /etc/asound.conf.
#
# Derivation: X5 overlay audio_hiwonder_rasadapter5b_x5_rdk.dts registers
# ONE dai-link (voicehat codec on dw_i2s1) under /hobot_sound_machine.
# Base DTS x5.dtsi enables no other ALSA card next to
# /soc/hobot_sound_machine, and soc-core.c assigns PCM device numbers by
# dai-link registration order (num = rtd->num), so the mono capture
# device is hw:0,0. Verify on hardware with 'arecord -D hw:0,0' before
# trusting the channel map (hw-verify pending).

pcm.x5_mic1 {
    # mono capture view (googlevoicehat codec, 1-ch ADC)
    type hw
    card "duplexaudioi2s1"
    device 0
}

pcm.x5_play1 {
    # playback shares the single duplex dai-link (hw device 0)
    type hw
    card "duplexaudioi2s1"
    device 0
}
