# Waveshare Audio Driver HAT V2 (X5): named-PCM contract, installed to
# /etc/asound.conf.
#
# Card topology: same overlay (audio_es7210_es8156_x5_rdk.dts) as the
# Decenta RDK Audio Kit boards, hw-verified on X5 MD (2026-11-19): card
# short id "duplexaudioi2s1"; dev0 = ES8156 stereo playback, dev1 =
# ES7210 8ch capture.
#
# Channel map (S100 chmap_ws tap-verified 2026-11-16): raw 8ch TDM
# ch0-3 live mics with wiring mic1->ch1, mic2->ch0, mic3->ch2, mic4->ch3
# (ch0/ch1 SWAPPED vs the Decenta kit CW 4->1 order); ch4/5 float;
# ch6/7 AEC ref. x5_mic4 below normalizes the swap so algorithm channel
# 0..3 = physical mic 1..4, matching the Decenta kit contract semantics.
# Per-mic wiring on X5: hw-verify pending (S100 order carried over).
#
# Duplex constraint: same shared I2S link as the Decenta boards - open
# capture FIRST, then playback at the SAME sample rate, both S16_LE
# (full matrix measured 2026-11-20, see rdk_audio_kit_6mic_ring.asound.conf).
#
# Contract rules: named PCMs only; overriding the default PCM or global
# defaults is forbidden (engine validate enforces).

pcm.x5_mic8 {
    # raw TDM capture view on this board (4 live mics + 2 floating + 2 ref),
    # exclusive access. NOTE: raw ch0/ch1 follow the Waveshare wiring
    # (mic2/mic1); use x5_mic4 for the normalized algorithm view.
    type hw
    card "duplexaudioi2s1"
    device 1
}

pcm.x5_mic4 {
    # 4mic algorithm contract: physical mic1-4 (swap-normalized) + 2 ref
    # (pure matrix from raw 8ch, no resample)
    type route
    slave {
        pcm "hw:CARD=duplexaudioi2s1,DEV=1"
        format S16_LE
        channels 8
    }
    ttable.0.1 1
    ttable.1.0 1
    ttable.2.2 1
    ttable.3.3 1
    ttable.4.6 1
    ttable.5.7 1
}

pcm.x5_play2 {
    # stereo playback to the ES8156 codec
    type hw
    card "duplexaudioi2s1"
    device 0
}
