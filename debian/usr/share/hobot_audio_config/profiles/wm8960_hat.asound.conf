# WM8960 Audio Driver HAT (X5): named-PCM contract, installed to
# /etc/asound.conf.
#
# Derivation: X5 overlay audio_wm8960_x5_rdk.dts registers ONE dai-link
# (wm8960 on dw_i2s1) under /hobot_sound_machine. Base DTS x5.dtsi enables
# no other ALSA card next to /soc/hobot_sound_machine, and soc-core.c
# assigns PCM device numbers by dai-link registration order (num =
# rtd->num), so both capture and playback are on hw:0,0 (wm8960 is a
# duplex codec: one ADC pair + one DAC pair on the same link).
# Verify on hardware with 'arecord -D hw:0,0' / 'aplay -D hw:0,0' before
# trusting the channel map (hw-verify pending).

pcm.x5_mic2 {
    # stereo capture view (wm8960 ADC pair)
    type hw
    card "duplexaudioi2s1"
    device 0
}

pcm.x5_play2 {
    # stereo playback view (wm8960 DAC pair)
    type hw
    card "duplexaudioi2s1"
    device 0
}
