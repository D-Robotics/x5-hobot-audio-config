# RDK Audio Kit 4-Mic (Decenta, X5): named-PCM contract, installed to
# /etc/asound.conf.
#
# Card topology hw-verified on X5 MD (2026-11-19): card name
# "duplexaudioi2s1"; dev0 = ES8156 stereo playback, dev1 = ES7210 8ch
# capture ('aplay -l' / 'arecord -l' on target). This reverses the earlier
# kernel-code-derived assumption (dev0=es7210/dev1=es8156) - the .ctrl
# assets of the other HAT profiles still carry the old derivation comment;
# they were verified correct only for control names, not device numbers.
#
# Channel map (S100 chmap_4mic 2026-11-14): ch1-4 live mics (CW 4->1),
# ch5/6 float, ch7/8 AEC ref (raw 8ch TDM). NOT the Waveshare mic order
# (Waveshare HAT V2 has its own waveshare_hat_v2 profile).
#
# Contract rules: named PCMs only; overriding the default PCM or global
# defaults is forbidden (engine validate enforces).

pcm.x5_mic8 {
    # raw TDM capture view on this board (exclusive access)
    type hw
    card "duplexaudioi2s1"
    device 1
}

pcm.x5_mic4 {
    # 4mic algorithm contract: first 4 mics + 2 ref (pure matrix from raw
    # 8ch, no resample)
    type route
    slave {
        pcm "hw:CARD=duplexaudioi2s1,DEV=1"
        format S16_LE
        channels 8
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.2.2 1
    ttable.3.3 1
    ttable.4.6 1
    ttable.5.7 1
}

pcm.x5_play2 {
    # stereo playback to the ES8156 codec
    type hw
    card "duplexaudioi2s1"
    device 0
}
