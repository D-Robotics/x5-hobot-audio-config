# Audio Driver HAT V1 (X5): named-PCM contract, installed to /etc/asound.conf.
#
# Card topology hw-verified on X5 MD + 6-mic ring sibling (2026-11-19):
# this HAT uses the same X5 overlay (audio_es7210_es8156_x5_rdk.dts) as
# HAT V2, so the card short id and PCM device numbers are identical:
# card "duplexaudioi2s1" (ALSA strips hyphens from the overlay card name
# "duplex-audio-i2s1" into the /proc/asound id; named-card matching uses
# the short id); dev0 = ES8156 stereo playback, dev1 = ES7210 8ch capture
# ('aplay -l' / 'arecord -l' on target; reverses the earlier
# kernel-code-derived assumption dai-link@0 -> hw:0,0).
#
# Channel map: 4 live mics + 2 float + 2 AEC ref in the raw 8ch TDM view
# (same overlay as V2; per-mic wiring differs, hw-verify pending on a V1
# HAT). Verify on hardware with 'arecord -D x5_mic8 -f S16_LE -c 8'.

pcm.x5_mic8 {
    # raw TDM capture view on this board (4 live mics + 2 floating + 2 ref),
    # exclusive access
    type hw
    card "duplexaudioi2s1"
    device 1
}

pcm.x5_mic4 {
    # 4mic algorithm contract (V1 is a 4-mic board): 4 mics + 2 ref
    # (pure matrix from raw 8ch, no resample)
    type route
    slave {
        pcm "hw:CARD=duplexaudioi2s1,DEV=1"
        format S16_LE
        channels 8
    }
    ttable.0.0 1
    ttable.1.1 1
    ttable.2.2 1
    ttable.3.3 1
    ttable.4.6 1
    ttable.5.7 1
}

pcm.x5_play2 {
    # stereo playback to the ES8156 codec
    type hw
    card "duplexaudioi2s1"
    device 0
}
